name: SICA Ticket

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: read

jobs:
  generate-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SICA_URL: https://restaurante.szn.ifsp.edu.br/sicaweb/home
      SICA_PRONTUARIO: ${{ secrets.SICA_PRONTUARIO }}
      DEST_EMAIL: ${{ secrets.DEST_EMAIL }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      HEADLESS: "true"
      TIMEOUT_MS: "90000"
      GOTO_RETRIES: "3"
      ARTIFACTS_DIR: artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check SICA connectivity
        run: |
          python - <<'PY'
          import urllib.request
          import ssl
          url = "https://restaurante.szn.ifsp.edu.br/sicaweb/home"
          context = ssl.create_default_context()
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60, context=context) as response:
              print("status:", response.status)
              print("final_url:", response.geturl())
              print("server:", response.headers.get("server"))
          PY

      - name: Generate and send ticket
        run: python generate_ticket.py

      - name: Show status
        if: always()
        run: |
          if [ -f artifacts/status.txt ]; then
            cat artifacts/status.txt
          fi
          if [ -f artifacts/last_error.txt ]; then
            echo ""
            echo "==== last_error.txt ===="
            cat artifacts/last_error.txt
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sica-ticket-artifacts
          path: artifacts/
          if-no-files-found: ignore
